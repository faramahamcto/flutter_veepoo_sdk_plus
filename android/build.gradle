group = "site.shasmatic.flutter_veepoo_sdk"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "site.shasmatic.flutter_veepoo_sdk"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        // Vendor SDK libraries as plain .jar files (not .aar): AGP explicitly forbids a library
        // module (which is what this plugin is - it produces its own AAR via bundleDebugAar)
        // from directly depending on local .aar files at all, regardless of dependency notation
        // ("Direct local .aar file dependencies are not supported when building an AAR").
        // Their bundled native (.so) libraries live under src/main/jniLibs/ instead - see
        // NATIVE_LIBRARIES.md.
        implementation fileTree(dir: 'libs', include: ['*.jar'])
        implementation "com.google.code.gson:gson:2.12.1"
        // vpprotocol-2.3.71.15 unconditionally calls McuMgrOtaManager.init() on every BLE
        // connect (added for Nordic-chip OTA support), referencing classes under
        // io.runtime.mcumgr.dfu.mcuboot/dfu.suit that aren't bundled in any of the vendor's
        // own jars, so every connection crashed with NoClassDefFoundError unless we supply
        // them ourselves. Unlike the vendor .aar files, this is a normal remote Maven Central
        // artifact, so it isn't subject to AGP's "local .aar" library-module restriction.
        //
        // Must be io.runtime.mcumgr (not the renamed no.nordicsemi.android.mcumgr group that
        // took over at 3.0.0+, which moves everything to the no.nordicsemi.android.mcumgr.*
        // package and breaks vpprotocol's compiled references). The last io.runtime.mcumgr
        // group release, 0.12.0-beta4, predates the io.runtime.mcumgr.dfu.mcuboot package
        // split vpprotocol needs, so we pin to no.nordicsemi.android:mcumgr-*:2.9.0 instead -
        // last version published before the 3.x package rename, and verified via bytecode
        // diff (javap) that every class/method/field McuMgrOtaManager.class references
        // (FirmwareUpgradeManager, its Settings.Builder, ImageSet, CacheImageSet,
        // McuMgrBleTransport) matches exactly.
        implementation "no.nordicsemi.android:mcumgr-ble:2.9.0"
        implementation "no.nordicsemi.android:mcumgr-core:2.9.0"
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.2.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
