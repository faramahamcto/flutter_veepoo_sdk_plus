group = "site.shasmatic.flutter_veepoo_sdk"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "site.shasmatic.flutter_veepoo_sdk"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        // Vendor SDK libraries (.jar and .aar) as plain local file dependencies rather than
        // flatDir + name/ext module notation. flatDir repositories are only visible to the
        // project that declares them — when this plugin is included as a subproject of a
        // consuming app's Gradle build, resolving the app's own classpath needs these same
        // artifacts, but the app has no way to know about a flatDir repo declared only in our
        // build.gradle, so that dependency edge fails to resolve ("Could not find :xxx-1.0:").
        // A plain file reference has no repository/module-coordinate lookup at all, so it can't
        // hit that problem — AGP still merges each .aar's manifest/resources/native libraries
        // correctly either way.
        implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
        implementation "com.google.code.gson:gson:2.12.1"
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.2.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
