group = "site.shasmatic.flutter_veepoo_sdk"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "site.shasmatic.flutter_veepoo_sdk"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        // Vendor SDK libraries as plain .jar files (not .aar): AGP explicitly forbids a library
        // module (which is what this plugin is - it produces its own AAR via bundleDebugAar)
        // from directly depending on local .aar files at all, regardless of dependency notation
        // ("Direct local .aar file dependencies are not supported when building an AAR").
        // Their bundled native (.so) libraries live under src/main/jniLibs/ instead - see
        // NATIVE_LIBRARIES.md.
        implementation fileTree(dir: 'libs', include: ['*.jar'])
        implementation "com.google.code.gson:gson:2.12.1"
        // vpprotocol-2.3.71.15 unconditionally calls McuMgrOtaManager.init() on every BLE
        // connect (added for Nordic-chip OTA support), referencing
        // io.runtime.mcumgr.ble.McuMgrBleTransport. That class isn't bundled in any of the
        // vendor's own jars, so every connection crashes with NoClassDefFoundError unless we
        // supply it ourselves. Unlike the vendor .aar files, this is a normal remote Maven
        // Central artifact, so it isn't subject to AGP's "local .aar" library-module
        // restriction and resolves transitively (mcumgr-core, Nordic's ble library, etc.).
        implementation "io.runtime.mcumgr:mcumgr-ble:0.12.0-beta4"
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.2.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
