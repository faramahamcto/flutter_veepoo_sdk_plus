group = "site.shasmatic.flutter_veepoo_sdk"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Scoped to this module only (unlike allprojects above) so it doesn't affect dependency
// resolution for the consuming app or other plugins sharing this Gradle build.
repositories {
    flatDir {
        dirs "$projectDir/libs"
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "site.shasmatic.flutter_veepoo_sdk"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        implementation fileTree(dir: 'libs', include: ['*.jar'])
        // Vendor SDK libraries, as .aar (not .jar) so their bundled native (.so) libraries and
        // manifests get merged in properly by AGP. Resolved via the flatDir repository above.
        implementation(name: 'vpprotocol-2.3.71.15', ext: 'aar')
        implementation(name: 'vpbluetooth-1.20', ext: 'aar')
        implementation(name: 'JL_Watch_V1.13.1_11214-release', ext: 'aar')
        implementation(name: 'jl_rcsp_V0.7.2_527-release', ext: 'aar')
        implementation(name: 'jl_bt_ota_V1.10.0_10931-release', ext: 'aar')
        implementation(name: 'BmpConvert_V1.6.0_10604-release', ext: 'aar')
        implementation(name: 'abpartool-release', ext: 'aar')
        implementation "com.google.code.gson:gson:2.12.1"
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.2.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
